<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srushti & Neil's Wedding Invitation</title>
    <!-- Google Fonts for Elegant Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Pinyon+Script&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Color Palette & Variables --- */
        :root {
            --bg-tropical: #0B3C37; /* Deep Kerala Tropical Teal/Green */
            --accent-gold: #D4AF37; /* Royal Marigold Gold */
            --accent-saffron: #E35E25; /* Maharashtrian Saffron/Orange */
            --text-light: #F9F6F0; /* Soft Off-White */
            --text-dark: #1A332E;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-tropical);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                linear-gradient(135deg, rgba(11, 60, 55, 0.95) 0%, rgba(7, 41, 37, 0.98) 100%);
        }

        /* --- Cultural Graphical Accents (CSS Art) --- */
        .background-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        /* Palm Frond Silhouette (Kerala/Coastal vibe) */
        .palm-leaves {
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            opacity: 0.15;
            background: radial-gradient(circle, transparent 40%, var(--accent-gold) 100%);
            border-radius: 50%;
        }

        /* --- Main Invitation Card --- */
        .invitation-container {
            position: relative;
            z-index: 2;
            background-color: var(--card-bg);
            color: var(--text-dark);
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 3px double var(--accent-gold);
            outline: 15px solid rgba(255, 255, 255, 0.05);
        }

        /* --- Traditional Border Details (Marigold/Toran Inspired) --- */
        .invitation-container::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(227, 94, 37, 0.3); /* Saffron inner line */
            pointer-events: none;
        }

        /* Culture Motif: Border Corners inspired by traditional motifs */
        .corner-motif {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--accent-gold);
        }
        .top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* --- Typography --- */
        .header-badge {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-saffron);
            font-weight: 600;
            margin-bottom: 25px;
        }

        .couple-names {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.8rem;
            color: var(--bg-tropical);
            margin: 20px 0;
            line-height: 1.2;
            font-weight: 700;
        }

        .ampersand {
            font-family: 'Pinyon Script', cursive;
            font-size: 4rem;
            display: block;
            color: var(--accent-gold);
            margin: -10px 0;
        }

        .cultural-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            width: 80%;
        }

        .cultural-divider::before, .cultural-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
        }

        /* Simple geometric representation of a festive marigold/paisley center */
        .motif-center {
            width: 12px;
            height: 12px;
            background-color: var(--accent-saffron);
            transform: rotate(45deg);
            margin: 0 15px;
            box-shadow: 0 0 0 4px var(--accent-gold);
        }

        .details-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #777;
            margin-bottom: 5px;
        }

        .date-time {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.3rem;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .location-venue {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--bg-tropical);
            margin-bottom: 8px;
        }

        .location-address {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
            max-width: 80%;
            margin: 0 auto 30px auto;
        }

        /* --- Media Queries for Mobile Responsiveness --- */
        @media (max-width: 480px) {
            .invitation-container {
                padding: 40px 20px;
            }
            .couple-names {
                font-size: 2.2rem;
            }
            .ampersand {
                font-size: 3.2rem;
            }
            .date-time {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-elements">
        <div class="palm-leaves"></div>
    </div>

    <div class="invitation-container">
        <!-- Cultural Corner Accents -->
        <div class="corner-motif top-left"></div>
        <div class="corner-motif top-right"></div>
        <div class="corner-motif bottom-left"></div>
        <div class="corner-motif bottom-right"></div>

        <!-- Invitation Content -->
        <p class="header-badge">Together with their families</p>
        
        <h1 class="couple-names">
            Srushti 
            <span class="ampersand">&</span> 
            Neil
        </h1>

        <div class="cultural-divider">
            <div class="motif-center"></div>
        </div>

        <p class="details-label">Save The Date</p>
        <p class="date-time">Saturday, 12th December 2026</p>

        <p class="details-label">The Venue</p>
        <p class="location-venue">Village Canopy</p>
        <p class="location-address">
            Kallanchery Rd, North Kumbalangi, Kumbalangi, Kochi,<br>
            Kerala 682007, India
        </p>

        <div class="cultural-divider" style="width: 40%;">
            <div class="motif-center" style="background-color: var(--accent-gold); box-shadow: none; width: 6px; height: 6px;"></div>
        </div>
    </div>

</body>
</html>
